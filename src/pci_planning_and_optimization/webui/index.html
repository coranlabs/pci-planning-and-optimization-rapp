<html lang="en" class="theme-light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PCI Pool — Network Operations</title>

  <link rel="stylesheet" href="/static/vendor/maplibre-gl.css" />
  <script src="/static/vendor/maplibre-gl.js"></script>
  <link rel="stylesheet" href="/static/webfonts.css" />

  <style>    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }

    html { font-size: 16px; }
    @media (min-width: 1700px) { html { font-size: 15.5px; } }
    @media (min-width: 2200px) { html { font-size: 14.5px; } }
    @media (min-width: 2800px) { html { font-size: 14px; } }
    body {
      font-family: var(--font-sans);
      font-feature-settings: "ss01","cv11","tnum";
      color: var(--fg);
      background: var(--bg);
      overflow-x: hidden;
      font-size: 16.5px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; color: inherit; cursor: pointer; }
    table { border-collapse: collapse; }

    :root {

      --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      --font-display: "Inter", ui-sans-serif, system-ui, sans-serif;
      --font-serif: "Instrument Serif", "Times New Roman", serif;

      --accent: #38BDF8;
      --accent-soft: color-mix(in oklch, var(--accent) 18%, transparent);

      --bg: #0A0F1F;
      --bg-2: #0E1428;
      --bg-3: #131B33;
      --bg-rail: #080C18;
      --line: #1B2542;
      --line-2: #243156;
      --fg: #E5ECFF;
      --fg-2: #9DB0D9;
      --fg-3: #5E709C;
      --fg-4: #3A4870;

      --ok:    #22C55E;
      --warn:  #F59E0B;
      --crit:  #EF4444;
      --info:  #38BDF8;
      --maint: #A78BFA;

      --r-xs: 4px;
      --r-sm: 6px;
      --r-md: 8px;
      --r-lg: 12px;

      --gap-1: 4px;
      --gap-2: 8px;
      --gap-3: 12px;
      --gap-4: 16px;
      --gap-5: 20px;
      --gap-6: 24px;

      --pad-panel: 18px;
      --rail-w: 200px;
      --kpi-h: 102px;
    }


    .theme-dark {
      --bg: #060A18;
      --bg-2: #0C1226;
      --bg-3: #131B33;
      --bg-rail: #04070F;
      --line: #1B2542;
      --line-2: #28345A;
      --fg: #E8EEFF;
      --fg-2: #A5B5DA;
      --fg-3: #5E709C;
      --fg-4: #2E3D69;
    }
    .theme-light {
      --bg: #F4F6FB;
      --bg-2: #FFFFFF;
      --bg-3: #F8FAFD;
      --bg-rail: #0C1226;
      --line: #E2E8F2;
      --line-2: #C9D3E5;
      --fg: #0E1428;
      --fg-2: #4A5876;
      --fg-3: #788AAB;
      --fg-4: #B6C0D4;
    }
    :root {
      --r-xs: 4px;
      --r-sm: 5px;
      --r-md: 7px;
      --r-lg: 10px;
      --pad-panel: 18px;
    }
    .panel {
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: var(--bg-2);
    }
    .panel-title {
      font-weight: 600;
      letter-spacing: -0.01em;
    }






    .app { min-height: 100vh; display: grid; grid-template-columns: var(--rail-w) 1fr; }

    .rail {
      position: sticky; top: 0; height: 100vh;
      background: var(--bg-rail);
      border-right: 1px solid var(--line);
      display: flex; flex-direction: column;
      padding: 18px 14px;
      z-index: 5;
      overflow: hidden;
    }
    .rail-brand-row { display: flex; align-items: center; gap: 10px; padding: 0 4px 18px; min-width: 0; }
    .rail-brand {
      width: 44px; height: 44px; border-radius: var(--r-sm);

      background: transparent;
      display: grid; place-items: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .rail-brand img {
      width: 100%; height: 100%;
      object-fit: contain;
    }
    .rail-brand-name { display: flex; flex-direction: column; min-width: 0; line-height: 1.2; flex: 1; }
    .rail-brand-name b {
      font-family: var(--font-display); font-weight: 600;
      font-size: 13px; letter-spacing: -0.015em;

      color: #E5ECFF;

      white-space: normal;
      overflow-wrap: normal;
      word-break: keep-all;
      hyphens: none;
    }
    .rail-brand-name small {
      color: #9DB0D9; font-weight: 400; font-size: 11.5px;
      margin-top: 2px; letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .rail-section-label { font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-4); padding: 14px 10px 6px; }
    .rail-nav { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
    .rail-btn {
      display: flex; flex-direction: row; align-items: center; gap: 12px;
      width: 100%; padding: 9px 10px;
      border: 0; background: transparent;
      color: var(--fg-3);
      border-radius: var(--r-sm);
      font-size: 13.5px; font-weight: 500;
      letter-spacing: 0.03em; text-transform: uppercase;
      text-align: left;
      position: relative; white-space: nowrap;
      transition: color .12s ease, background .12s ease;
    }
    .rail-btn > span:not(.rail-badge) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .rail-btn:hover { color: var(--fg); background: var(--bg-3); }
    .rail-btn[data-on="1"] { color: var(--accent); background: color-mix(in oklch, var(--accent) 12%, transparent); }
    .rail-btn[data-on="1"]::before {
      content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px;
      background: var(--accent); border-radius: 0 2px 2px 0;
    }
    .rail-btn svg { width: 17px; height: 17px; stroke-width: 1.6; flex-shrink: 0; }
    .rail-foot { padding-top: 10px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }

    .top-bar {
      display: flex; align-items: center; gap: var(--gap-4);
      padding: 12px 22px;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
      position: sticky; top: 0; z-index: 4;
      backdrop-filter: blur(12px);
    }
    .brand-block { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
    .brand-block h1 {
      margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.015em;
      font-family: var(--font-display);
    }
    .brand-block span.crumb {
      color: var(--fg-3); font-size: 13px;
      padding-left: 10px; border-left: 1px solid var(--line);
    }

    .search {
      flex: 1; max-width: 460px;
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      background: var(--bg-2);
      color: var(--fg-3);
      font-size: 14px;
    }
    .search input {
      flex: 1; background: transparent; border: 0; outline: 0;
      color: var(--fg); font: inherit;
    }
    .search kbd {
      font-family: var(--font-mono); font-size: 11px;
      padding: 2px 5px; border: 1px solid var(--line); border-radius: 3px;
      color: var(--fg-3); background: var(--bg-3);
    }

    .top-meta { display: flex; align-items: center; gap: 8px; margin-left: auto; }

    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--bg-2);
      font-size: 12px; font-weight: 500;
      color: var(--fg-2);
      letter-spacing: 0.02em;
    }
    .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--fg-3); }
    .pill.live .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in oklch, var(--ok) 22%, transparent); animation: live-pulse 1.6s ease-in-out infinite; }
    .pill.ok .dot { background: var(--ok); }
    .pill.warn .dot { background: var(--warn); }
    .pill.crit .dot { background: var(--crit); }
    .pill.stale { color: var(--warn); border-color: color-mix(in oklch, var(--warn) 45%, var(--line)); }
    .pill.stale .dot { background: var(--warn); }
    .pill .mono { font-family: var(--font-mono); font-size: 12px; color: var(--fg); font-variant-numeric: tabular-nums; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-sm[data-busy="1"] svg, .user-menu-item[data-busy="1"] svg { animation: spin 0.8s linear infinite; }
    .btn-sm[data-busy="1"] { pointer-events: none; opacity: 0.75; }
    @keyframes live-pulse {
      0%,100% { box-shadow: 0 0 0 0 color-mix(in oklch, var(--ok) 35%, transparent); }
      50%     { box-shadow: 0 0 0 4px color-mix(in oklch, var(--ok) 12%, transparent); }
    }

    .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), color-mix(in oklch, var(--accent) 50%, var(--fg)));
      color: var(--bg-2);
      display: grid; place-items: center;
      font-weight: 600; font-size: 13px;
    }


    .main {
      padding: var(--gap-5) var(--gap-5) 80px;
      display: flex; flex-direction: column; gap: var(--gap-4);
      width: 100%;
      min-width: 0;
    }

    @media (min-width: 1900px) {
      .main { padding: var(--gap-6) 32px 80px; }
    }
    @media (min-width: 2400px) {
      .main { padding: 32px 48px 96px; gap: 20px; }
      .kpi-strip { gap: 16px; }
    }

    .section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 4px 0 2px; flex-wrap: wrap; }
    .section-head h2 { margin: 0; font-family: var(--font-display); font-size: 30px; font-weight: 600; letter-spacing: -0.02em; color: var(--fg); }
    .section-head p { margin: 4px 0 0; font-size: 15.5px; color: var(--fg-2); max-width: 720px; line-height: 1.55; }

    .form-row { display: grid; grid-template-columns: 240px 1fr; gap: 24px; padding: 18px 0; border-bottom: 1px solid var(--line); }
    .form-row:last-child { border-bottom: 0; }
    .form-row label { font-size: 14px; font-weight: 500; color: var(--fg); }
    .form-row label small { display: block; color: var(--fg-3); font-weight: 400; font-size: 13px; margin-top: 4px; line-height: 1.45; }
    .input { padding: 8px 12px; font: inherit; font-size: 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg-3); color: var(--fg); }
    .input:focus { outline: none; border-color: var(--accent); }




    .audit-row { display: grid; grid-template-columns: 90px 1fr auto; gap: 16px; padding: 14px 0; border-bottom: 1px dashed var(--line); align-items: start; }
    .audit-row:last-child { border-bottom: 0; }
    .audit-row .t { font-family: var(--font-mono); font-size: 12px; color: var(--fg-3); padding-top: 4px; }
    .audit-row .ic { width: 24px; height: 24px; border-radius: 50%; background: var(--bg-3); display: grid; place-items: center; color: var(--fg-2); }
    .audit-row.crit .ic { background: color-mix(in oklch, var(--crit) 18%, transparent); color: var(--crit); }
    .audit-row.warn .ic { background: color-mix(in oklch, var(--warn) 18%, transparent); color: var(--warn); }
    .audit-row.info .ic { background: color-mix(in oklch, var(--info) 18%, transparent); color: var(--info); }
    .audit-row .who { font-family: var(--font-mono); font-size: 12.5px; color: var(--fg-3); }


    .grid { display: grid; gap: var(--gap-4); }


    .panel { padding: var(--pad-panel); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
    .panel-head {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    }
    .panel-head .titles { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .panel-title { font-size: 18px; font-weight: 600; color: var(--fg); margin: 0; }
    .panel-sub { font-size: 14.5px; color: var(--fg-2); }


    .seg {
      display: inline-flex; align-items: center; gap: 0;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      background: var(--bg-3);
    }
    .seg button {
      border: 0; background: transparent;
      padding: 4px 10px;
      font-size: 12px; font-weight: 500;
      color: var(--fg-3);
      border-radius: calc(var(--r-sm) - 1px);
      font-family: var(--font-mono);
      letter-spacing: 0.02em;
    }
    .seg button[data-on="1"] {
      background: var(--bg-2);
      color: var(--fg);
      box-shadow: 0 0 0 1px var(--line-2);
    }


    .kpi-editorial { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: var(--gap-4); }
    @media (max-width: 1180px) { .kpi-editorial { grid-template-columns: 1fr; } }
    .kpi-hero { padding: 22px 24px; display: grid; grid-template-rows: auto 1fr auto; gap: 14px; min-height: 260px; position: relative; overflow: hidden; }
    .kpi-hero::before { content: ""; position: absolute; left: 24px; top: 16px; width: 3px; height: 30px; background: var(--crit); border-radius: 2px; }
    .kpi-hero-head { padding-left: 14px; display: flex; flex-direction: column; gap: 5px; }
    .kpi-hero-eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--crit); }
    .kpi-hero-title { font-family: var(--font-display); font-size: 26px; font-weight: 600; letter-spacing: -0.02em; color: var(--fg); margin: 0; }
    .kpi-hero-body { display: flex; flex-direction: column; gap: 8px; padding-left: 14px; }
    .kpi-hero-num { display: flex; align-items: baseline; gap: 12px; font-family: var(--font-display); font-size: 64px; font-weight: 600; letter-spacing: -0.04em; line-height: 0.95; color: var(--fg); }
    .kpi-hero-num small { font-family: var(--font-sans); font-size: 15px; font-weight: 500; color: var(--fg-2); letter-spacing: 0; }
    .kpi-hero-desc { font-size: 16px; color: var(--fg-2); line-height: 1.55; max-width: 460px; }
    .kpi-hero-desc b { color: var(--fg); font-weight: 600; }
    .kpi-hero-foot { display: flex; align-items: center; gap: 10px; padding-left: 14px; padding-top: 8px; border-top: 1px dashed var(--line); flex-wrap: wrap; font-size: 11.5px; color: var(--fg-3); }
    .kpi-hero-tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line-2); border-radius: 999px; font-family: var(--font-mono); font-size: 13px; color: var(--fg-2); }
    .kpi-hero-spark { position: absolute; right: 24px; bottom: 20px; width: 240px; height: 80px; opacity: 0.95; }
    .kpi-hero-trend { position: relative; flex: 1; min-height: 132px; margin-top: 10px; display: flex; flex-direction: column; }
    .kpi-hero-trend svg { flex: 1; width: 100%; min-height: 0; display: block; }
    .kpi-hero-trend .grid-line { stroke: var(--line); stroke-width: 1; }
    .kht-title { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 4px; }
    .kht-ticks { position: absolute; right: 0; top: 20px; bottom: 18px; width: 30px; pointer-events: none; }
    .kht-ticks span { position: absolute; right: 0; transform: translateY(-50%); font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--fg-3); background: color-mix(in oklch, var(--bg-2) 85%, transparent); padding: 0 3px; }
    .kht-x { position: relative; height: 16px; margin-top: 4px; }
    .kht-x span { position: absolute; top: 2px; transform: translateX(-50%); font-family: var(--font-mono); font-size: 10.5px; color: var(--fg-3); white-space: nowrap; }
    .kht-x span:last-child { transform: translateX(-100%); }
    .kht-tip { position: absolute; top: 24px; z-index: 2; pointer-events: none; background: var(--bg-3); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 7px 10px; font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-2); min-width: 130px; box-shadow: 0 6px 18px rgba(0,0,0,.12); }
    .kht-tip div { display: flex; align-items: center; gap: 6px; line-height: 1.6; }
    .kht-tip b { color: var(--fg); margin-left: auto; font-weight: 600; }
    .kht-tip i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
    .kht-tip-t { color: var(--fg-3); margin-bottom: 2px; }

    .kpi {
      padding: 14px 16px; min-height: var(--kpi-h);
      display: flex; flex-direction: column; gap: 8px;
      position: relative; overflow: hidden;
    }
    .kpi-label {
      font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--fg-3); font-weight: 500;
      display: flex; align-items: center; gap: 6px;
    }
    .kpi-label .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .kpi-label .dot.warn { background: var(--warn); }
    .kpi-label .dot.crit { background: var(--crit); }
    .kpi-label .dot.ok { background: var(--ok); }
    .kpi-value {
      display: flex; align-items: baseline; gap: 6px;
      font-family: var(--font-display);
      font-size: 30px; font-weight: 600; letter-spacing: -0.025em;
      color: var(--fg);
      line-height: 1;
    }
    .kpi-value .unit { font-size: 14px; color: var(--fg-3); font-weight: 500; letter-spacing: 0; }
    .kpi-foot { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--fg-3); font-family: var(--font-mono); }
    .delta-up   { color: var(--ok); }
    .delta-down { color: var(--crit); }
    .kpi-spark { height: 22px; margin-top: 2px; }


    .row-primary { display: grid; grid-template-columns: minmax(0, 2.6fr) minmax(280px, 1fr); gap: var(--gap-4); }
    @media (max-width: 1280px) {
      .kpi-strip { grid-template-columns: repeat(3, 1fr); }
      .row-primary { grid-template-columns: 1fr; }
    }


    .chart-wrap {
      position: relative;
      padding: 28px 70px 8px 70px;
    }
    .chart-svg { width: 100%; display: block; height: 320px; }

    .chart-axis { position: absolute; pointer-events: none; }
    .chart-axis span {
      position: absolute;
      font-family: var(--font-mono);
      font-size: 19px;
      font-weight: 600;
      color: var(--fg-2);
      letter-spacing: 0.02em;
      white-space: nowrap;
      transform: translateY(-50%);
      line-height: 1;
    }

    .chart-axis-y-left  { top: 22px; height: 320px; left: 0; width: 56px; }
    .chart-axis-y-left  span { right: 10px; text-align: right; }
    .chart-axis-y-right { top: 22px; height: 320px; right: 0; width: 56px; }
    .chart-axis-y-right span { left: 10px; text-align: left; }

    .chart-axis-x       { position: relative; height: 18px; margin-top: 6px; }
    .chart-axis-x span  { transform: translateX(-50%); top: 4px; }

    .chart-axis .axis-unit {
      position: absolute;
      top: 0; transform: none;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg-3);
      opacity: 0.9;
    }
    .chart-axis-y-left  .axis-unit { right: 10px; top: -18px; }
    .chart-axis-y-right .axis-unit { left: 10px;  top: -18px; }
    .chart-legend { display: flex; gap: 28px; flex-wrap: wrap; padding-top: 14px; border-top: 1px dashed var(--line); }
    .legend-item { display: flex; align-items: center; gap: 12px; font-size: 18px; color: var(--fg); font-family: var(--font-mono); letter-spacing: 0.03em; font-weight: 600; }
    .legend-swatch { width: 28px; height: 4px; border-radius: 2px; }


    .tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
    .tbl th, .tbl td {
      text-align: left; padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
      white-space: nowrap;
    }
    .tbl thead th {
      font-size: 11.5px; font-weight: 500;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--fg-3);
      background: var(--bg-3);
      border-bottom: 1px solid var(--line-2);
      position: sticky; top: 0; z-index: 1;
    }
    .tbl tbody tr { transition: background .1s ease; }
    .tbl tbody tr:hover { background: var(--bg-3); cursor: pointer; }
    .tbl tbody tr.selected { background: color-mix(in oklch, var(--accent) 10%, transparent); }
    .tbl .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
    .tbl .id  { font-family: var(--font-mono); color: var(--fg); }
    .tbl .muted { color: var(--fg-3); }


    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 0; border-radius: 0;
      font-size: 11.5px; letter-spacing: 0.06em;
      text-transform: uppercase; font-weight: 600;
      font-family: var(--font-mono);
      border: 0; background: transparent;
      color: var(--fg-2);
    }
    .chip .dot {

    .cell-tower:hover { z-index: 99; }
    .cell-tower .mast {
      position: absolute; left: 50%; bottom: 3px; width: 3px; height: 26px;
      transform: translateX(-50%);
      background: linear-gradient(to right, color-mix(in oklch, var(--accent) 30%, #000) 0%, var(--accent) 50%, color-mix(in oklch, var(--accent) 30%, #000) 100%);
      border-radius: 1px;
      box-shadow: 0 0 0 0.5px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.5);
    }
    .cell-tower .top {
      position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
      width: 14px; height: 5px; border-radius: 1px;
      background: linear-gradient(to right, color-mix(in oklch, var(--accent) 40%, #000), var(--accent));
      box-shadow: 0 0 0 0.5px rgba(0,0,0,.4);
    }
    .cell-tower .top::before, .cell-tower .top::after {
      content: ""; position: absolute; top: -2px; width: 1.5px; height: 7px;
      background: var(--accent); border-radius: 0.5px;
    }
    .cell-tower .top::before { left: 1.5px; }
    .cell-tower .top::after  { right: 1.5px; }
    .cell-tower .pulse {
      position: absolute; left: 50%; bottom: 31px; transform: translate(-50%, 0);
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }
    .cell-tower .base {
      position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
      width: 14px; height: 5px;
      background: radial-gradient(ellipse at 50% 30%, color-mix(in oklch, var(--accent) 60%, #000), color-mix(in oklch, var(--accent) 20%, #000));
      border-radius: 50%;
      box-shadow: 0 3px 6px rgba(0,0,0,.55);
    }
    .cell-tower .shadow {
      position: absolute; left: 50%; bottom: -1px; transform: translateX(-50%);
      width: 22px; height: 5px;
      background: radial-gradient(ellipse, rgba(0,0,0,.55), transparent 70%);
      filter: blur(2px);
      pointer-events: none;
    }
    .cell-tower .label {
      position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%);
      font-family: var(--font-mono); font-size: 9px; font-weight: 600;
      letter-spacing: 0.04em; color: var(--fg);
      white-space: nowrap; pointer-events: none;
      padding: 1px 5px; border-radius: 2px;
      background: color-mix(in oklch, var(--bg-2) 86%, transparent);
      border: 0.5px solid var(--line-2);
      backdrop-filter: blur(4px);
      opacity: 0; transition: opacity .15s ease;
    }
    .cell-tower:hover .label, .cell-tower.selected .label { opacity: 1; }


    .cell-tower.degraded   { --accent: var(--warn); }
    .cell-tower.maintenance{ --accent: var(--maint); }
    .cell-tower.idle       { --accent: var(--fg-3); }
    .cell-tower.conflict   { --accent: var(--crit); }


    .cell-tower.conflict .pulse { animation: tower-beacon 0.9s ease-in-out infinite; }

    .cell-tower.dim { opacity: 0.22; }
    .cell-tower.dim .label { display: none; }
    .cell-tower.dim .pulse { animation: none; }

    .cell-tower.approx .mast,
    .cell-tower.approx .top { opacity: 0.6; }
    .cell-tower.approx .base {
      background: none;
      border: 1px dashed var(--accent);
      box-shadow: none;
    }
    @keyframes tower-beacon {
      0%, 100% { box-shadow: 0 0 8px var(--accent), 0 0 0 0 color-mix(in oklch, var(--accent) 60%, transparent); }

    .map-conflicts {

    .map-conflicts-row.sev-major .kind    { color: var(--warn); border-color: color-mix(in oklch, var(--warn) 40%, var(--line-2)); background: color-mix(in oklch, var(--warn) 12%, transparent); }

    .cell-cluster {
      position: absolute; top: 0; left: 0; z-index: 1;
      width: 36px; height: 36px;
      cursor: pointer;
      pointer-events: auto;
    }
    .cell-cluster-body {
      position: absolute; inset: 0;
      border-radius: 50%;
      background: color-mix(in oklch, var(--accent) 75%, var(--bg-2));
      color: #000;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 0 0 4px color-mix(in oklch, var(--accent) 30%, transparent),
                  0 0 0 8px color-mix(in oklch, var(--accent) 14%, transparent),
                  0 4px 14px rgba(0,0,0,0.4);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .cell-cluster .count {
      position: relative; z-index: 2;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .cell-cluster .ring {
      position: absolute; inset: -6px;
      border-radius: 50%;
      border: 1px solid color-mix(in oklch, var(--accent) 50%, transparent);
      pointer-events: none;
      animation: cell-cluster-pulse 2.4s ease-out infinite;
    }
    @keyframes cell-cluster-pulse {
      0%   { transform: scale(0.9); opacity: 0.9; }
      70%  { transform: scale(1.3); opacity: 0;   }
      100% { transform: scale(1.3); opacity: 0;   }
    }
    .cell-cluster:hover .cell-cluster-body {
      transform: scale(1.12);
      box-shadow: 0 0 0 5px color-mix(in oklch, var(--accent) 40%, transparent),
                  0 0 0 10px color-mix(in oklch, var(--accent) 18%, transparent),
                  0 6px 18px rgba(0,0,0,0.5);
    }

    .cell-cluster.has-conflict .cell-cluster-body {
      background: color-mix(in oklch, var(--warn) 80%, var(--bg-2));
      box-shadow: 0 0 0 4px color-mix(in oklch, var(--warn) 30%, transparent),
                  0 0 0 8px color-mix(in oklch, var(--warn) 14%, transparent),
                  0 4px 14px rgba(0,0,0,0.4);
    }
    .cell-cluster.has-conflict .ring { border-color: color-mix(in oklch, var(--warn) 55%, transparent); }

    @media (prefers-reduced-motion: reduce) {
      .cell-tower .pulse,
      .cell-cluster .ring,
      .map-conflicts-head .dot.crit { animation: none !important; }
      .cell-tower-body, .cell-cluster-body { transition: none; }

    }

    .ppl-side {

      text-transform: uppercase; color: var(--fg-2);
    }

      color: var(--fg-2);

      border: 1px solid var(--line);
      background: var(--bg-2);
    }


    .ppl-dropzone {

    }
    .ppl-dropzone:hover { border-color: color-mix(in oklch, var(--accent) 45%, var(--line-2)); background: color-mix(in oklch, var(--accent) 4%, var(--bg-2)); }
    .ppl-dropzone.drag {
      border-color: var(--accent); border-style: solid;

    .ppl-dropzone-icon {
      width: 38px; height: 38px;
      border-radius: 10px;

      margin-bottom: 2px;

    .ppl-dropzone-t2 .lk { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
    .ppl-dropzone-busy {
      position: absolute; top: 6px; right: 8px;
      font-family: var(--font-mono); font-size: 10px;
      color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.10em;
      animation: ppl-pulse 1.4s ease-in-out infinite;
    }
    @keyframes ppl-pulse { 0%,100%{opacity:1}50%{opacity:.4} }

    .ppl-list { flex: 1; overflow-y: auto; padding: 6px 8px 12px; }

    .ppl-card {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background .12s;
      position: relative;
    }
    .ppl-card + .ppl-card { margin-top: 2px; }
    .ppl-card:hover { background: var(--bg-3); }
    .ppl-card.selected { background: color-mix(in oklch, var(--accent) 10%, transparent); }
    .ppl-card.selected::before {
      content: ''; position: absolute; left: -2px; top: 8px; bottom: 8px;
      width: 3px; background: var(--accent); border-radius: 0 2px 2px 0;
    }
    .ppl-card .ico {
      width: 32px; height: 32px;
      border-radius: 6px;
      background: var(--bg-3);
      border: 1px solid var(--line);
      color: var(--fg-3);
      display: grid; place-items: center;
      flex-shrink: 0;
    }
    .ppl-card.selected .ico {
      background: color-mix(in oklch, var(--accent) 14%, transparent);
      color: var(--accent);
      border-color: color-mix(in oklch, var(--accent) 30%, var(--line));
    }
    .ppl-card .meta { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .ppl-card .name {
      font-family: var(--font-mono);
      font-size: 13px; color: var(--fg);
      font-weight: 600;
      letter-spacing: -0.005em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ppl-card .info {
      font-size: 11.5px; color: var(--fg-2); font-family: var(--font-mono);
      font-weight: 500;
      display: flex; gap: 5px; align-items: center;
    }
    .ppl-card .info .dot { width: 2px; height: 2px; border-radius: 50%; background: var(--fg-4); display: inline-block; }
    .ppl-card .badge {
      font-family: var(--font-mono); font-size: 10px; font-weight: 700;
      padding: 2px 7px; border-radius: 4px;
      letter-spacing: 0.08em; text-transform: uppercase;
      background: var(--bg-3); color: var(--fg-3);
      border: 1px solid var(--line);
      white-space: nowrap;
    }
    .ppl-card .badge.applied { background: color-mix(in oklch, var(--ok) 14%, transparent); color: var(--ok); border-color: color-mix(in oklch, var(--ok) 35%, transparent); }
    .ppl-card .badge.pending { background: color-mix(in oklch, var(--warn) 14%, transparent); color: var(--warn); border-color: color-mix(in oklch, var(--warn) 35%, transparent); }
    .ppl-card .del {
      width: 22px; height: 22px;
      border: 0; border-radius: 5px;
      background: transparent; color: var(--fg-4);

      opacity: 0; transition: opacity .12s, color .12s, background .12s;
    }
    .ppl-card:hover .del { opacity: 1; }
    .ppl-card .del:hover { background: color-mix(in oklch, var(--crit) 14%, transparent); color: var(--crit); }
    .ppl-card-foot {
      display: flex; gap: 6px; align-items: center; margin-top: 4px;
    }


    .ppl-main {
      display: flex; flex-direction: column;
      min-width: 0; background: var(--bg-2);
    }
    .ppl-main-head {
      padding: 14px 22px;

      flex-wrap: wrap;
    }

      padding: 1px 6px; border-radius: 999px;

      font-weight: 700;

    }
    .ppl-chip[data-on="1"] .ct { background: var(--accent); color: var(--bg); }

    .ppl-table-wrap { flex: 1; overflow: auto; min-height: 320px; max-height: 520px; }
    .ppl-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .ppl-tbl thead th {
      position: sticky; top: 0; z-index: 1;
      background: var(--bg-2);
      text-align: left;
      padding: 11px 16px;
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.10em; text-transform: uppercase;
      color: var(--fg-2);
      border-bottom: 1px solid var(--line-2);
    }
    .ppl-tbl tbody td {
      padding: 13px 16px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
      white-space: nowrap;
      font-size: 13.5px;
      color: var(--fg);
    }
    .ppl-tbl tbody tr { transition: background .1s; }
    .ppl-tbl tbody tr:hover { background: var(--bg-3); }
    .ppl-tbl tbody tr.row-changed { background: color-mix(in oklch, var(--accent) 4%, transparent); }
    .ppl-tbl tbody tr.row-changed:hover { background: color-mix(in oklch, var(--accent) 8%, transparent); }
    .ppl-tbl .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 500; }
    .ppl-tbl .row-num { color: var(--fg-2); font-family: var(--font-mono); font-size: 12.5px; font-weight: 500; }
    .ppl-tbl .cell-id { font-family: var(--font-mono); color: var(--fg); font-weight: 600; font-size: 13.5px; letter-spacing: -0.005em; }
    .ppl-tbl .site { color: var(--fg-3); font-size: 12px; font-weight: 500; margin-top: 3px; }
    .ppl-tbl .gnb { font-family: var(--font-mono); color: var(--fg-2); font-size: 12.5px; font-weight: 500; }


    .ppl-pci {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 13px; font-weight: 700;
      padding: 3px 10px; border-radius: 4px;
      min-width: 40px; text-align: center;
      border: 1px solid transparent;
      letter-spacing: -0.01em;
    }
    .ppl-pci.current {
      background: var(--bg-3);
      color: var(--fg-2);
      border-color: var(--line);
    }
    .ppl-pci.new-same {
      background: var(--bg-3);
      color: var(--fg-3);
      border-color: var(--line);
    }
    .ppl-pci.new-change {
      background: color-mix(in oklch, var(--accent) 18%, transparent);
      color: var(--accent);
      border-color: color-mix(in oklch, var(--accent) 40%, transparent);
    }
    .ppl-diff-arrow {
      color: var(--fg-4);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 0 6px;
    }
    .row-changed .ppl-diff-arrow { color: var(--accent); }

    .ppl-status {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 9px;
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      border: 1px solid;
    }
    .ppl-status .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .ppl-status.change   { color: var(--accent); border-color: color-mix(in oklch, var(--accent) 40%, transparent); background: color-mix(in oklch, var(--accent) 12%, transparent); }
    .ppl-status.noop     { color: var(--fg-3); border-color: var(--line); background: var(--bg-3); }

    .ppl-foot {
      padding: 14px 22px;
      border-top: 1px solid var(--line);
      background: var(--bg);
      display: flex; align-items: center; gap: 18px;
      flex-wrap: wrap;

      display: flex; align-items: baseline; gap: 8px;

      font-size: 12.5px;
      font-weight: 600;

      font-family: var(--font-display);
      font-size: 18px; font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--fg);
      line-height: 1;
    }
    .ppl-foot-stat .l { color: var(--fg-2); letter-spacing: 0.08em; text-transform: uppercase; font-size: 11px; font-weight: 700; }
    .ppl-foot-stat.change .n { color: var(--accent); }

      margin: 12px 22px 0;

      font-weight: 500;

      background: color-mix(in oklch, var(--crit) 12%, transparent);

    .ppl-empty {

    .stg-shell {

      grid-template-columns: 240px minmax(0, 1fr);
      gap: 24px;
      align-items: flex-start;
    }
    @media (max-width: 1000px) { .stg-shell { grid-template-columns: 1fr; } }

      display: flex; flex-direction: column;
      padding: 6px 0;

      font-size: 13.5px; font-weight: 600;

      letter-spacing: -0.005em;
    }
    .stg-row-label .h {

      font-weight: 500;

    .stg-row-control { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }


    .stg-switch {
      position: relative;
      width: 40px; height: 22px;

      border-radius: 999px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background .15s, border-color .15s;
    }
    .stg-switch::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 16px; height: 16px;
      background: var(--fg-3);
      border-radius: 50%;
      transition: transform .18s cubic-bezier(.4,1.4,.6,1), background .15s;
    }
