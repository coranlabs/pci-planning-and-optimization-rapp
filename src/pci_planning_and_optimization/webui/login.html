<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Sign in · PCI Planning &amp; Optimization</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 14px; line-height: 1.45; color: #101828;
    background: #f4f5f7;
    display: flex; flex-direction: column; align-items: center;
    padding: 9vh 16px 32px;
  }

  .container { width: 100%; max-width: 384px; }

  .brand {
    display: flex; align-items: center; gap: 10px;
    margin: 0 2px 18px;
  }
  .brand img { width: 30px; height: 30px; object-fit: contain; }
  .brand-name { font-size: 14.5px; font-weight: 600; color: #1a2233; }
  .brand-sub { font-size: 12px; color: #667085; margin-top: 1px; }

  .card {
    background: #fff;
    border: 1px solid #d9dee5;
    border-radius: 6px;
    padding: 26px 28px 24px;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
  }
  h1 { font-size: 17px; font-weight: 600; margin-bottom: 3px; }
  .sub { font-size: 13px; color: #667085; margin-bottom: 20px; }

  .alert {
    display: none;
    margin-bottom: 16px; padding: 9px 12px;
    font-size: 13px; color: #b42318;
    background: #fef3f2; border: 1px solid #f0c4c0; border-radius: 4px;
  }
  .alert.visible { display: block; }

  .field { margin-bottom: 15px; }
  .field-head {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 6px;
  }
  label { font-size: 13px; font-weight: 500; color: #344054; }
  .toggle-pw {
    border: 0; background: none; padding: 0;
    font-size: 12px; color: #475467; cursor: pointer;
  }
  .toggle-pw:hover { color: #101828; text-decoration: underline; }

  input {
    width: 100%; height: 38px; padding: 0 12px;
    font: inherit; color: #101828;
    background: #fff; border: 1px solid #cfd4dc; border-radius: 4px;
    outline: none;
    transition: border-color 0.1s, box-shadow 0.1s;
  }
  input::placeholder { color: #98a2b3; }
  input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
  input[aria-invalid="true"] { border-color: #d92d20; }

  button[type="submit"] {
    width: 100%; height: 38px; margin-top: 4px;
    font: inherit; font-weight: 500; color: #fff;
    background: #2563eb; border: 0; border-radius: 4px; cursor: pointer;
  }
  button[type="submit"]:hover { background: #1e53c9; }
  button[type="submit"]:focus-visible { outline: 2px solid #1e53c9; outline-offset: 2px; }
  button[type="submit"]:disabled { background: #93b1ec; cursor: default; }

  .help {
    margin-top: 18px; padding-top: 15px;
    border-top: 1px solid #eaecf0;
    font-size: 12.5px; color: #667085;
  }

  .footer {
    margin-top: 22px; text-align: center;
    font-size: 12px; color: #98a2b3;
  }

  noscript p {
    margin-bottom: 16px; padding: 9px 12px;
    font-size: 13px; color: #93540b;
    background: #fffaeb; border: 1px solid #f2dcaa; border-radius: 4px;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <img src="/static/coran-logo.png" alt=""/>
      <div>
        <div class="brand-name">PCI Planning &amp; Optimization</div>
        <div class="brand-sub">Operator console</div>
      </div>
    </div>

    <form class="card" id="login-form" method="post" action="/api/auth/login">
      <h1>Sign in</h1>
      <p class="sub">Use your operator account to continue.</p>

      <noscript><p>JavaScript is required to sign in.</p></noscript>
      <div class="alert" id="alert" role="alert"></div>

      <div class="field">
        <div class="field-head"><label for="username">Username</label></div>
        <input id="username" name="username" type="text" required
               autocomplete="username" autocapitalize="none" spellcheck="false" autofocus/>
      </div>

      <div class="field">
        <div class="field-head">
          <label for="password">Password</label>
          <button type="button" class="toggle-pw" id="toggle-pw"
                  aria-controls="password">Show</button>
        </div>
        <input id="password" name="password" type="password" required
               autocomplete="current-password"/>
      </div>

      <button type="submit" id="submit">Sign in</button>

      <p class="help">
        Access is restricted to authorised operators. If you need an
        account, contact your network administrator.
      </p>
    </form>

    <p class="footer">PCI Planning and Optimization rApp __APP_VERSION__ &middot; &copy; 2026 coRAN Labs</p>
  </div>
